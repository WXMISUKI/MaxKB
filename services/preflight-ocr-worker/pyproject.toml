[project]
name = "preflight-ocr-worker"
version = "0.1.0"
description = "Standalone OCR ingestion worker for construction preflight evidence."
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn==0.30.6",
    "pydantic==2.10.6",
    "requests>=2.31,<3",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
